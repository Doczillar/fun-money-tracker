<title>Fun Money</title>
<style>
  :root {
    --bg: #14181C;
    --surface: #1E262C;
    --surface-raised: #262F36;
    --ink: #EDEAE3;
    --muted: #8B959D;
    --gold: #E8B94D;
    --coral: #E2694B;
    --mint: #6FBF8B;
    --track: #333E46;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  .num {
    font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  header .month {
    color: var(--muted);
    font-size: 14px;
  }
  header .month.overdue {
    color: var(--coral);
    font-weight: 600;
  }

  .gear {
    background: none;
    border: none;
    color: var(--muted);
    padding: 8px;
    margin: -8px;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .gear:hover { color: var(--ink); }
  .gear:active { background: var(--surface); }

  .banner {
    background: var(--surface-raised);
    border: 1px solid var(--track);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
  }
  .banner.show { display: flex; }
  .banner button {
    background: var(--gold);
    color: #14181C;
    border: none;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .balance-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 28px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }

  .gauge-wrap {
    position: relative;
    width: 200px;
    height: 200px;
  }

  .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track { stroke: var(--track); }
  .gauge-fill {
    stroke: var(--mint);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
  }
  @keyframes entryIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: none; }
  }
  .entry-row.just-added { animation: entryIn 0.3s ease; }
  @keyframes amountPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .gauge-center .amount.pulse { animation: amountPulse 0.45s ease; }

  .float-amount {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translateX(-50%);
    font-weight: 700;
    font-size: 20px;
    font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    pointer-events: none;
    white-space: nowrap;
    animation: floatDown 1.1s ease-out forwards;
  }
  .float-amount.spent { color: var(--coral); }
  .float-amount.added { color: var(--mint); }
  @keyframes floatDown {
    0% { opacity: 0; transform: translate(-50%, -6px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 64px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gauge-fill { transition: none; }
    .entry-row.just-added { animation: none; }
    .gauge-center .amount.pulse { animation: none; }
    .float-amount { animation: floatFade 1.1s ease-out forwards; }
  }
  @keyframes floatFade {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }

  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .gauge-center .amount {
    font-size: 30px;
    font-weight: 700;
  }
  .gauge-center .of {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .status-warning { color: var(--coral); }

  .entry-form {
    background: var(--surface);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
  }

  .form-row {
    display: flex;
    gap: clamp(6px, 2vw, 10px);
    margin-bottom: 10px;
  }

  .amount-input {
    flex: 1 1 0;
    min-width: 0;
    background: var(--surface-raised);
    border: 1px solid var(--track);
    border-radius: 14px;
    padding: 14px 12px;
    font-size: clamp(16px, 5vw, 20px);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  }
  .amount-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  .type-toggle {
    display: flex;
    flex-shrink: 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--track);
  }
  .type-toggle button {
    border: none;
    background: var(--surface-raised);
    color: var(--muted);
    padding: 0 clamp(10px, 3vw, 16px);
    font-size: clamp(12px, 3.5vw, 14px);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .type-toggle button.active[data-type="spent"] { background: var(--coral); color: #1a1210; }
  .type-toggle button.active[data-type="added"] { background: var(--mint); color: #0f1a12; }

  .note-input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--track);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .note-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .note-input::placeholder, .amount-input::placeholder { color: var(--muted); }

  .add-btn {
    width: 100%;
    background: var(--gold);
    color: #14181C;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:disabled { opacity: 0.4; cursor: default; }

  .error-text {
    color: var(--coral);
    font-size: 13px;
    margin: -4px 0 10px 2px;
    display: none;
  }
  .error-text.show { display: block; }

  .entries h2 {
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px 4px;
  }

  .entry-row {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 10px;
  }

  .entry-left { display: flex; flex-direction: column; min-width: 0; }
  .entry-note { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .entry-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .entry-amount { font-size: 15px; font-weight: 600; }
  .entry-amount.spent { color: var(--coral); }
  .entry-amount.added { color: var(--mint); }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    padding: 6px;
    cursor: pointer;
    line-height: 1;
  }
  .delete-btn:active { color: var(--coral); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 10px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    transform: scale(0.96);
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .modal-overlay.show .modal {
    transform: scale(1);
    opacity: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .modal { transition: none; }
  }

  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

  .modal label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .modal-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--gold); color: #14181C; }
  .btn-secondary { background: var(--surface-raised); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--coral); border: 1px solid var(--coral); }

  #resetSection label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #resetSection .btn {
    font-size: 13px;
    padding: 12px 8px;
  }

  .divider {
    height: 1px;
    background: var(--track);
    margin: 18px 0;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>Fun Money</h1>
      <div class="month" id="monthLabel">—</div>
    </div>
    <button class="gear" id="openSettings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="7.5"/>
        <circle cx="12" cy="12" r="2.75"/>
        <line x1="19.5" y1="12" x2="22.5" y2="12"/>
        <line x1="17.3" y1="17.3" x2="19.42" y2="19.42"/>
        <line x1="12" y1="19.5" x2="12" y2="22.5"/>
        <line x1="6.7" y1="17.3" x2="4.58" y2="19.42"/>
        <line x1="4.5" y1="12" x2="1.5" y2="12"/>
        <line x1="6.7" y1="6.7" x2="4.58" y2="4.58"/>
        <line x1="12" y1="4.5" x2="12" y2="1.5"/>
        <line x1="17.3" y1="6.7" x2="19.42" y2="4.58"/>
      </svg>
    </button>
  </header>

  <div class="banner" id="newMonthBanner">
    <span>It's a new month &mdash; start fresh?</span>
    <button id="startFreshBtn">Start month</button>
  </div>

  <div class="balance-card">
    <div class="gauge-wrap">
      <svg viewBox="0 0 160 160">
        <circle class="gauge-track" cx="80" cy="80" r="70" fill="none" stroke-width="14"/>
        <circle class="gauge-fill" id="gaugeFill" cx="80" cy="80" r="70" fill="none" stroke-width="14"
          stroke-dasharray="439.8" stroke-dashoffset="0"/>
      </svg>
      <div class="gauge-center">
        <div class="amount num" id="remainingAmount">$0.00</div>
        <div class="of" id="budgetOf">of $0.00</div>
      </div>
    </div>
  </div>

  <div class="entry-form">
    <div class="form-row">
      <input class="amount-input" id="amountInput" type="text" inputmode="decimal" placeholder="$0.00">
      <div class="type-toggle">
        <button type="button" class="active" data-type="spent" id="typeSpent">Spent</button>
        <button type="button" data-type="added" id="typeAdded">Added</button>
      </div>
    </div>
    <div class="error-text" id="errorText">Enter an amount greater than $0.</div>
    <input class="note-input" id="noteInput" type="text" placeholder="What for? (optional)" maxlength="40">
    <button class="add-btn" id="addBtn">Add entry</button>
  </div>

  <div class="entries">
    <h2>This month</h2>
    <div id="entriesList"></div>
  </div>

</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h3 id="modalTitle">Set your fun money</h3>
    <p id="modalSubtitle">How much can you spend on fun stuff this month?</p>
    <label for="budgetInput">Base fun money per month</label>
    <input class="amount-input" id="budgetInput" type="text" inputmode="decimal" placeholder="$400.00" style="width:100%">
    <div class="modal-btn-row">
      <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
      <button class="btn btn-primary" id="saveSettings">Save</button>
    </div>
    <div class="divider" id="resetDivider" style="display:none"></div>
    <div id="resetSection" style="display:none">
      <label>Start new month</label>
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="carryOverBtn">Roll over<br><span class="num" id="carryOverAmount"></span></button>
        <button class="btn btn-secondary" id="zeroStartBtn">Start fresh<br><span class="num" id="freshStartAmount"></span></button>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <label>Backup (recommended)</label>
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="exportBtn">Export</button>
        <button class="btn btn-secondary" id="importBtn">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3>Start new month?</h3>
    <p id="confirmSubtitle">This clears all of this month's entries.</p>
    <div class="modal-btn-row">
      <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Start month</button>
    </div>
  </div>
</div>

<script>
(function() {
  var STORAGE_KEY = 'funMoneyApp';
  var CIRCUMFERENCE = 2 * Math.PI * 70;

  var state = load() || { baseBudget: 400, budget: null, monthKey: null, entries: [] };

  // Migrate older saved data that predates the base amount concept
  if (typeof state.baseBudget !== 'number') {
    state.baseBudget = (typeof state.budget === 'number' && state.budget > 0) ? state.budget : 400;
  }

  var currentType = 'spent';

  function currentMonthKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1);
  }

  function daysRemainingLabel() {
    var now = new Date();
    var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    var remaining = daysInMonth - now.getDate() + 1;
    var monthName = now.toLocaleString('en-US', { month: 'long' });
    return remaining + (remaining === 1 ? ' day' : ' days') + ' remaining in ' + monthName;
  }

  function parseMonthKey(key) {
    var parts = key.split('-');
    return { year: parseInt(parts[0], 10), month: parseInt(parts[1], 10) };
  }

  function monthKeyName(key) {
    var mk = parseMonthKey(key);
    return new Date(mk.year, mk.month - 1, 1).toLocaleString('en-US', { month: 'long' });
  }

  function daysSinceMonthEnded(key) {
    var mk = parseMonthKey(key);
    var endOfMonth = new Date(mk.year, mk.month, 0);
    var now = new Date();
    var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((startOfToday - endOfMonth) / 86400000);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Could not save', e);
    }
  }

  function fmt(n) {
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toFixed(2);
  }

  function parseAmount(str) {
    var n = parseFloat(String(str).replace(/[^0-9.]/g, ''));
    return isNaN(n) ? NaN : n;
  }

  function computeRemaining() {
    var total = state.budget || 0;
    state.entries.forEach(function(e) {
      total += e.type === 'added' ? e.amount : -e.amount;
    });
    return total;
  }

  function render() {
    var newMonth = state.monthKey && state.monthKey !== currentMonthKey();
    var monthLabelEl = document.getElementById('monthLabel');
    if (newMonth) {
      var daysSince = daysSinceMonthEnded(state.monthKey);
      monthLabelEl.textContent = daysSince + (daysSince === 1 ? ' day' : ' days') + ' since ' + monthKeyName(state.monthKey) + ' ended';
      monthLabelEl.classList.add('overdue');
    } else {
      monthLabelEl.textContent = daysRemainingLabel();
      monthLabelEl.classList.remove('overdue');
    }

    document.getElementById('newMonthBanner').classList.toggle('show', !!newMonth);

    var budget = state.budget || 0;
    var remaining = computeRemaining();
    var ratio = budget > 0 ? Math.max(0, Math.min(1, remaining / budget)) : 0;
    var offset = CIRCUMFERENCE * (1 - ratio);

    var fillEl = document.getElementById('gaugeFill');
    fillEl.setAttribute('stroke-dashoffset', offset);

    var lowFunds = remaining < budget * 0.2;
    fillEl.style.stroke = lowFunds ? 'var(--coral)' : 'var(--mint)';

    var amountEl = document.getElementById('remainingAmount');
    amountEl.textContent = fmt(remaining);
    amountEl.classList.toggle('status-warning', remaining < 0);

    document.getElementById('budgetOf').textContent = remaining < 0
      ? 'over this month\u2019s budget'
      : 'of ' + fmt(budget);

    renderEntries();
  }

  function renderEntries() {
    var list = document.getElementById('entriesList');
    list.innerHTML = '';

    if (state.entries.length === 0) {
      list.innerHTML = '<div class="empty-state">No entries yet. Add your first one above.</div>';
      return;
    }

    var running = state.budget || 0;
    var withBalance = state.entries.map(function(e) {
      running += e.type === 'added' ? e.amount : -e.amount;
      return { entry: e, balance: running };
    });

    withBalance.slice().reverse().forEach(function(item) {
      var e = item.entry;
      var row = document.createElement('div');
      row.className = 'entry-row' + (e.id === justAddedId ? ' just-added' : '');

      var d = new Date(e.ts);
      var timeStr = d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

      row.innerHTML =
        '<div class="entry-left">' +
          '<div class="entry-note">' + (e.note ? escapeHtml(e.note) : (e.type === 'added' ? 'Added funds' : 'Spent')) + '</div>' +
          '<div class="entry-meta">' + timeStr + ' &middot; balance ' + fmt(item.balance) + '</div>' +
        '</div>' +
        '<div class="entry-right">' +
          '<div class="entry-amount ' + e.type + ' num">' + (e.type === 'added' ? '+' : '\u2212') + fmt(e.amount).replace('$','$').replace('-','') + '</div>' +
          '<button class="delete-btn" data-id="' + e.id + '" aria-label="Delete entry">&times;</button>' +
        '</div>';

      list.appendChild(row);
    });

    Array.prototype.forEach.call(list.querySelectorAll('.delete-btn'), function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.getAttribute('data-id');
        state.entries = state.entries.filter(function(e) { return e.id !== id; });
        save();
        render();
      });
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Entry form ---
  // Handle the Spent/Added toggle on touchstart/mousedown with preventDefault so
  // the buttons never take focus - this keeps the keyboard open if the user is
  // mid-entry in the amount field. Click stays bound for keyboard accessibility
  // (setType is idempotent, so any double-fire is harmless).
  function bindTypeButton(id, type) {
    var el = document.getElementById(id);
    el.addEventListener('touchstart', function(e) { e.preventDefault(); setType(type); }, { passive: false });
    el.addEventListener('mousedown', function(e) { e.preventDefault(); setType(type); });
    el.addEventListener('click', function() { setType(type); });
  }
  bindTypeButton('typeSpent', 'spent');
  bindTypeButton('typeAdded', 'added');

  function setType(t) {
    currentType = t;
    document.getElementById('typeSpent').classList.toggle('active', t === 'spent');
    document.getElementById('typeAdded').classList.toggle('active', t === 'added');
  }

  var justAddedId = null;

  document.getElementById('addBtn').addEventListener('click', function() {
    var input = document.getElementById('amountInput');
    var amount = parseAmount(input.value);
    var errorEl = document.getElementById('errorText');

    if (isNaN(amount) || amount <= 0) {
      errorEl.classList.add('show');
      return;
    }
    errorEl.classList.remove('show');

    var note = document.getElementById('noteInput').value.trim();
    var newId = Date.now() + '-' + Math.random().toString(36).slice(2, 7);

    state.entries.push({
      id: newId,
      amount: Math.round(amount * 100) / 100,
      type: currentType,
      note: note,
      ts: Date.now()
    });

    save();
    input.value = '';
    document.getElementById('noteInput').value = '';
    setType('spent');

    justAddedId = newId;
    render();
    justAddedId = null;

    // Pulse the remaining balance as a quick "recorded" cue
    var amtEl = document.getElementById('remainingAmount');
    amtEl.classList.remove('pulse');
    void amtEl.offsetWidth; // restart the animation if it's still mid-run
    amtEl.classList.add('pulse');

    // Float a signed amount down away from the gauge: coral "−$X.XX" for
    // spending, mint "+$X.XX" for additions. pointer-events is disabled in
    // CSS so the page stays fully interactive while it plays.
    var entryType = state.entries[state.entries.length - 1].type;
    var entryAmount = state.entries[state.entries.length - 1].amount;
    var floatEl = document.createElement('div');
    floatEl.className = 'float-amount ' + entryType + ' num';
    floatEl.textContent = (entryType === 'added' ? '+' : '\u2212') + '$' + entryAmount.toFixed(2);
    var wrap = document.querySelector('.gauge-wrap');
    wrap.appendChild(floatEl);
    var removed = false;
    function removeFloat() {
      if (removed) return;
      removed = true;
      if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
    }
    floatEl.addEventListener('animationend', removeFloat);
    setTimeout(removeFloat, 1500); // fallback in case animationend never fires
  });

  // --- Settings modal ---
  var overlay = document.getElementById('settingsOverlay');

  function openSettings() {
    var isFirstRun = state.budget === null;
    document.getElementById('modalTitle').textContent = isFirstRun ? 'Set your fun money' : 'Settings';
    document.getElementById('modalSubtitle').textContent = isFirstRun
      ? 'Set your base fun money per month. You can change it later.'
      : 'Changing the base amount applies to this month and future months.';
    document.getElementById('budgetInput').value = state.baseBudget ? state.baseBudget.toFixed(2) : '';
    document.getElementById('resetDivider').style.display = isFirstRun ? 'none' : 'block';
    document.getElementById('resetSection').style.display = isFirstRun ? 'none' : 'block';
    document.getElementById('cancelSettings').style.display = isFirstRun ? 'none' : 'block';
    if (!isFirstRun) {
      var currentRemaining = computeRemaining();
      var deltaSign = currentRemaining < 0 ? '\u2212' : '+';
      document.getElementById('carryOverAmount').textContent = deltaSign + '$' + Math.abs(currentRemaining).toFixed(2);
      document.getElementById('freshStartAmount').textContent = fmt(state.baseBudget);
    }
    overlay.classList.add('show');
  }

  function closeSettings() {
    overlay.classList.remove('show');
  }

  document.getElementById('openSettings').addEventListener('click', openSettings);
  document.getElementById('cancelSettings').addEventListener('click', closeSettings);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeSettings();
  });

  document.getElementById('saveSettings').addEventListener('click', function() {
    var val = parseAmount(document.getElementById('budgetInput').value);
    if (isNaN(val) || val <= 0) return;
    state.baseBudget = Math.round(val * 100) / 100;
    state.budget = state.baseBudget;
    state.monthKey = state.monthKey || currentMonthKey();
    save();
    closeSettings();
    render();
  });

  // --- New month confirmation ---
  var confirmOverlay = document.getElementById('confirmOverlay');
  var pendingRollOver = null;

  function askStartNewMonth(rollOver) {
    pendingRollOver = rollOver;
    var base = state.baseBudget;
    var msg;
    if (rollOver) {
      var leftover = computeRemaining();
      if (leftover > 0) {
        msg = 'Rolls over this month\u2019s surplus of ' + fmt(leftover) + ' into the new month. Last month\u2019s entries are cleared.';
      } else if (leftover < 0) {
        msg = 'Rolls over this month\u2019s deficit of ' + fmt(Math.abs(leftover)) + ' into the new month. Last month\u2019s entries are cleared.';
      } else {
        msg = 'No surplus or deficit to roll over \u2014 starts the new month at the base amount, ' + fmt(base) + '. Last month\u2019s entries are cleared.';
      }
    } else {
      msg = 'Starts the new month fresh at the base amount, ' + fmt(base) + '. Last month\u2019s entries are cleared.';
    }
    document.getElementById('confirmSubtitle').textContent = msg;
    confirmOverlay.classList.add('show');
  }

  function closeConfirm() {
    confirmOverlay.classList.remove('show');
    pendingRollOver = null;
  }

  confirmOverlay.addEventListener('click', function(e) {
    if (e.target === confirmOverlay) closeConfirm();
  });

  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);

  document.getElementById('confirmOk').addEventListener('click', function() {
    var rollOver = pendingRollOver;
    var leftover = computeRemaining();
    var lastMonthName = state.monthKey ? monthKeyName(state.monthKey) : 'last month';

    state.budget = state.baseBudget;
    state.entries = [];
    state.monthKey = currentMonthKey();

    if (rollOver && Math.abs(leftover) >= 0.005) {
      state.entries.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        amount: Math.round(Math.abs(leftover) * 100) / 100,
        type: leftover > 0 ? 'added' : 'spent',
        note: (leftover > 0 ? 'Surplus' : 'Deficit') + ' rolled over from ' + lastMonthName,
        ts: Date.now()
      });
    }

    save();
    closeConfirm();
    render();
  });

  document.getElementById('carryOverBtn').addEventListener('click', function() {
    closeSettings();
    askStartNewMonth(true);
  });

  document.getElementById('zeroStartBtn').addEventListener('click', function() {
    closeSettings();
    askStartNewMonth(false);
  });

  document.getElementById('startFreshBtn').addEventListener('click', openSettings);

  // --- Backup / restore ---
  document.getElementById('exportBtn').addEventListener('click', function() {
    var fileName = 'fun-money-backup-' + currentMonthKey() + '.json';
    var dataStr = JSON.stringify(state, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var file;
    try { file = new File([blob], fileName, { type: 'application/json' }); } catch (e) { file = null; }

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Fun Money backup' }).catch(function() {});
    } else {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }
  });

  document.getElementById('importBtn').addEventListener('click', function() {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', function(e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function() {
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (err) {
        alert('Couldn\u2019t read that file \u2014 it doesn\u2019t look like valid backup data.');
        return;
      }
      if (typeof parsed.baseBudget !== 'number' || !Array.isArray(parsed.entries)) {
        alert('That file doesn\u2019t look like a Fun Money backup.');
        return;
      }
      if (!confirm('Replace all current data with this backup? This can\u2019t be undone.')) return;
      state = parsed;
      save();
      closeSettings();
      render();
    };
    reader.readAsText(file);
  });

  // --- Init ---
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function() {});
  }

  if (state.budget === null) {
    openSettings();
  }
  if (!state.monthKey) {
    state.monthKey = currentMonthKey();
    save();
  }

  render();
})();
</script>
</body>
</html>
